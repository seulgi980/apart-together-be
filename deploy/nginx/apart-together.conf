# 호스트 nginx 설정. /etc/nginx/sites-available/apart-together 로 복사하고 YOUR_DOMAIN 을 바꾼다.
# 처음에는 이 파일(80번만)으로 시작하고, `sudo certbot --nginx -d YOUR_DOMAIN` 을 실행하면
# certbot이 443(HTTPS) 설정과 80 -> 443 이동을 이 파일에 자동으로 추가한다.
#
#   /api, /uploads  -> 백엔드 (127.0.0.1:8080)
#   /ws             -> 백엔드 WebSocket
#   그 밖의 전부     -> 프론트 (127.0.0.1:3000)

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # 프로필 사진 업로드 (백엔드 제한: 파일 2MB, 요청 3MB)
    client_max_body_size 3m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # 실시간 연결(WebSocket). 연결을 오래 열어 두므로 시간 제한을 늘린다.
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # location 안에서 proxy_set_header 를 쓰면 위의 공통 헤더가 물려지지 않아서 다시 적는다
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Next.js가 화면을 조각으로 흘려보내므로(스트리밍) 모아 두지 않는다
        proxy_buffering off;
    }
}
